<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>布偶瞄了个喵 · 玩法预览</title><style>
:root{font-family:system-ui,sans-serif;color:#34474b;background:#faf7f0}*{box-sizing:border-box}body{margin:0}main{max-width:470px;padding:24px;margin:auto}header{display:flex;justify-content:space-between;align-items:center;margin-bottom:28px}h1{font-size:20px;margin:0}h2{font-size:30px;margin:14px 0}small{color:#85978c;letter-spacing:2px}.sub{color:#879389;font-size:13px;line-height:1.8}button{cursor:pointer;border:0;border-radius:14px;background:#eceee3;color:#587664;padding:12px 17px;font:inherit}button:disabled{opacity:.4;cursor:default}.primary{display:block;background:#547a68;color:white;box-shadow:0 5px #3c5d4e;width:100%;margin:22px 0}.hero{text-align:center;padding:10px}.hero h2{line-height:1.5;font-size:36px}.cat{font-size:130px;padding:28px;border-radius:50%;background:radial-gradient(ellipse,#e1e9dc 0,transparent 65%)}.menu{display:flex;gap:9px}.menu button{flex:1;font-size:13px}.board{position:relative;background:#eef0e6;border-radius:18px;width:100%;overflow:hidden}.tile{position:absolute;padding:0;border:1px solid #d2dcd4;background:#fffefb;border-radius:10px;box-shadow:0 4px #b9c9c6;display:flex;flex-direction:column;justify-content:center;align-items:center;gap:4px}.tile span{font-size:26px}.tile small{font-size:8px;letter-spacing:0;color:#34474b}.tile.covered{background:#cfd8d0;filter:saturate(.45);color:#718176}.tile.covered span{opacity:.5}.tray{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;padding:9px;background:#dfdfcc;border-radius:12px;margin-top:14px}.slot{border-radius:8px;height:58px;background:#fffdf6;text-align:center;font-size:25px;padding-top:5px;animation:pop .2s ease-out}.slot.empty{background:#d0d5c1}.slot small{display:block;font-size:7px;letter-spacing:0}.tools{display:flex;gap:8px;margin-top:18px}.tools button{flex:1;font-size:13px;padding:12px 5px}.stats{display:flex;justify-content:space-between;font-size:13px;margin:17px 0;color:#83917f}.stash{display:flex;align-items:center;gap:8px;margin:14px 0;min-height:40px;font-size:12px;color:#879389}.stash button{padding:5px}.notice{padding:16px;border-radius:15px;background:#e1eadb;margin-top:15px;text-align:center}.notice h3{margin:0 0 6px}.level{display:flex;gap:14px;width:100%;align-items:center;text-align:left;margin:12px 0;background:#fffdf6;border:1px solid #e1e6d8}.badge{font-size:26px;color:#547a68;min-width:30px}.level div{flex:1}.level small{display:block;letter-spacing:0;font-size:11px;margin-top:5px}.album{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:20px 0}.card{text-align:center;background:#fffdf6;padding:13px 4px;border-radius:12px;font-size:12px}.card div{font-size:40px;margin-bottom:10px}.footer{text-align:center;font-size:11px;color:#96a08f;margin:28px 0}.guide{line-height:2;font-size:14px}a{color:#547a68}button:focus-visible{outline:3px solid #c2a05a;outline-offset:3px}@keyframes pop{from{transform:scale(.9)}to{transform:scale(1)}}@media(prefers-reduced-motion:reduce){*{animation:none!important}}
.hero-photo{width:200px;height:245px;object-fit:cover;object-position:center 25%;border-radius:110px 110px 65px 65px;border:6px solid #fffdf6;box-shadow:0 12px 20px #dce3d5}.cat{padding:18px}.card-picture{display:block;object-fit:contain;pointer-events:none;background:#fffdf6}.tile{gap:0;overflow:hidden}.tile .card-picture{width:78%;height:78%}.tile.covered .card-picture{opacity:.24}.slot{padding-top:0;overflow:hidden}.slot .card-picture{width:100%;height:43px}.slot small{line-height:12px}.album-art{height:100px;display:flex;align-items:center;justify-content:center;font-size:13px!important;overflow:hidden;border-radius:10px}.album-art .card-picture{width:100%;height:100%}.stash .card-picture{width:34px;height:34px}.hero-photo{object-fit:contain;background:#fffdf6;width:220px;height:220px;border-radius:45px}.board{background:#e2efcf}.tile{border-radius:5px;border:1px solid #546b45;box-shadow:0 4px #7d9d70}.tile .card-picture{width:88%;height:88%}.tile:disabled{opacity:1;cursor:not-allowed}.tile.covered{background:#adb8a4;filter:none;border-color:#7c8874}.tile.covered .card-picture{opacity:.4;filter:brightness(.7)}.tray{background:#cfa86c;border-bottom:5px solid #9e7847}.tile.bonus{border:2px solid #c49430}.bonus-badge{position:absolute;right:2px;top:0;color:#ad7d12;font-size:11px!important;font-weight:bold;line-height:14px}</style></head><body><main><header><h1>布偶瞄了个喵</h1><button id="home">回小窝</button></header><div id="app"></div><div class="footer">本地玩法预览 · 与小程序共用游戏规则引擎<br>原生画面及真机功能请在微信开发者工具检查</div></main><script src="/cards.js"></script><script src="/engine.js"></script><script>
const E=window.GAME_ENGINE,{CARDS,LEVELS}=window.CARD_DATA,app=document.querySelector('#app');let game=null,screen='home',progress=load('xb_preview_progress_v4_two_levels')||{unlocked:1,cleared:{}},saved=load('xb_preview_save_v6_three_levels');if(progress.cleared&&progress.cleared[1])progress.unlocked=Math.max(3,Number(progress.unlocked)||1);function load(k){try{return JSON.parse(localStorage.getItem(k))}catch(e){return null}}function store(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}function btn(label,action,cls=''){const b=document.createElement('button');b.textContent=label;b.className=cls;b.onclick=action;return b}function el(tag,cls,text){const n=document.createElement(tag);n.className=cls||'';if(text)n.textContent=text;return n}function cardArt(c){return '<img class="card-picture" src="'+c.image+'" alt="'+c.name+'" draggable="false">'}function save(){if(game&&game.status!=='won'){saved=game;store('xb_preview_save_v6_three_levels',game)}}function home(){save();screen='home';app.innerHTML='<div class="hero"><small>A LITTLE PAUSE, A LITTLE PURR</small><h2>把烦恼消掉，<br>把可爱留下。</h2><p class="sub">陪小宝玩一局，今天也要软乎乎。</p><div class="cat"><img class="hero-photo" src="/assets/cards/00.jpg" alt="歪头小宝插画"></div></div>';app.append(btn('开始陪小宝玩 ↗',()=>start(progress.unlocked-1),'primary'));if(saved&&saved.status!=='won')app.append(btn('继续上次的牌局',()=>{game=saved;render()}));const menu=el('div','menu');menu.append(btn('▦ 关卡小路',levels),btn('✿ 卡牌图鉴',album),btn('? 新手指南',guide));app.append(menu)}document.querySelector('#home').onclick=home;
function start(i){game=E.create(i);render()}
function levels(){screen='levels';app.innerHTML='<small>THREE LITTLE ADVENTURES</small><h2>小宝的关卡小路</h2><p class="sub">第一关9张明牌，第二关216张，第三关1000张，全部采用确认的24种图片。</p>';LEVELS.forEach((l,i)=>{const b=btn('',()=>start(i),'level');b.disabled=i>=progress.unlocked;b.innerHTML='<span class="badge">'+(b.disabled?'🔒':i+1)+'</span><div>'+l.name+'<small>'+l.count+' 张 · '+l.kinds+' 种图案</small></div><span>'+(progress.cleared[i]?'★'.repeat(progress.cleared[i]):'→')+'</span>';app.append(b)})}
function album(){screen='album';const max=CARD_DATA.unlockedTheme(progress.unlocked);app.innerHTML='<small>XIAOBAO’S LITTLE COLLECTION</small><h2>24 种小小欢喜</h2><p class="sub">已解锁 '+((max+1)*8)+' / 24 · 通关解锁更多主题</p>';const grid=el('div','album');CARDS.forEach(c=>{const n=el('div','card');n.innerHTML='<div class="album-art">'+(c.theme<=max?cardArt(c):'待解锁')+'</div>'+(c.theme<=max?c.name:'待解锁');grid.append(n)});app.append(grid)}
function guide(){screen='guide';app.innerHTML='<h2>小宝的游戏说明</h2><div class="guide">全游戏共三关：9张明牌教学、216张极限挑战、1000张千张挑战。第三关有999张三消牌和1张金边奖励牌，奖励牌直接收集、不占槽位。<br>① 下层牌只要没有上层牌压住，就可以点击；旁边相邻的牌不会阻挡。点击未被遮挡的牌，收入7格收集槽。<br>② 完全相同的3张自动消除，槽满且不能消除即失败。<br>③ 场上、槽内、寄存区全部清空才通关。<br>④ 撤回、洗牌、寄存、复活每局各一次。撤回仅限最近一次未消除的操作；寄存最多3张，可点击取回。<br>⑤ 寄存区非空不能洗牌；槽内散牌太多时，也可能需要先寄存。<br>⑥ 不用道具三星，用1～2次两星，更多一星。<br>⑦ 进度保存在当前浏览器，微信进度与此独立。</div>';app.append(btn('明白啦，开始玩',()=>start(0),'primary'))}
function action(fn){const r=fn();if(r===false||r&&r.ok===false){alert(r&&r.reason||'现在不能使用该道具');return}render()}
function render(){screen='game';if(game.status==='won'){const used=Object.values(game.tools).reduce((n,v)=>n+1-v,0),stars=used===0?3:used<=2?2:1;progress.unlocked=Math.min(LEVELS.length,Math.max(progress.unlocked,game.level+2));progress.cleared[game.level]=Math.max(progress.cleared[game.level]||0,stars);store('xb_preview_progress_v4_two_levels',progress);try{localStorage.removeItem('xb_preview_save_v6_three_levels')}catch(e){}saved=null;}else save();
app.innerHTML='<small>LEVEL '+String(game.level+1).padStart(2,'0')+'</small><h2>'+LEVELS[game.level].name+'</h2><div class="stats"><span>剩余 '+E.remaining(game)+' 张</span><span>已消除 '+game.matched+' 组</span><span>'+game.moves+' 步</span></div>';
const board=el('div','board'),width=Math.min(422,window.innerWidth-48),k=width/340;board.style.height=(LEVELS[game.level].height*k)+'px';E.renderTiles(game).forEach(t=>{const c=CARDS[t.card],b=btn('',()=>action(()=>E.pick(game,t.id)),'tile'+(t.bonus?' bonus':'')+(E.available(game,t)?'':' covered'));b.disabled=game.status!=='playing'||!E.available(game,t);Object.assign(b.style,{left:t.x*k+'px',top:t.y*k+'px',width:t.size*k+'px',height:t.size*k+'px',zIndex:t.z+1});b.innerHTML=cardArt(c)+(t.bonus?'<span class="bonus-badge">福</span>':'');b.setAttribute('aria-label',(t.bonus?'小宝奖励牌，不占槽位':c.name)+(E.available(game,t)?'，可选':'，被遮挡'));board.append(b)});app.append(board);const tray=el('div','tray');for(let i=0;i<7;i++){const c=CARDS[game.tray[i]],n=el('div','slot'+(c?'':' empty'));if(c)n.innerHTML=cardArt(c)+'<small>'+c.name+'</small>';tray.append(n)}app.append(tray);const stash=el('div','stash','临时寄存：');game.stash.forEach((id,i)=>{const b=btn('',()=>action(()=>E.takeStash(game,i)));b.innerHTML=cardArt(CARDS[id]);b.setAttribute('aria-label',CARDS[id].name);stash.append(b)});if(!game.stash.length)stash.append(el('span','','空空的，需要时再用'));app.append(stash);
const tools=el('div','tools');for(const [label,count,fn] of [['↶ 撤回',game.tools.undo,()=>E.undo(game)],['⤨ 洗牌',game.tools.shuffle,()=>E.reshuffle(game)],['▱ 寄存',game.tools.stash,()=>E.store(game)]]){const b=btn(label+' '+count,()=>action(fn));b.disabled=game.status!=='playing'||!count;tools.append(b)}app.append(tools);
if(game.status!=='playing'){const n=el('div','notice');n.innerHTML='<h3>'+(game.status==='won'?'🎉 小宝为你鼓掌！':'🐾 小篮子装满啦')+'</h3><p class="sub">'+(game.status==='won'?'这一关的烦恼，全部消掉啦。':'没关系，小宝陪你再想想。')+'</p>';if(game.status==='lost'&&game.tools.revive&&!game.stash.length)n.append(btn('免费复活',()=>action(()=>E.store(game,true))));if(game.status==='won')n.append(btn(game.level<LEVELS.length-1?'下一关 →':'全部关卡',()=>game.level<LEVELS.length-1?start(game.level+1):levels()));n.append(btn('重新挑战',()=>start(game.level)));app.append(n)}
}window.addEventListener('resize',()=>{if(screen==='game')render()});home();
</script></body></html>
